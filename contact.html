<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Mihir's Portfolio</title>
    <style>
        body {
            background-color: #0d0d2b;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
        }


        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #141445;
            padding: 15px 60px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
        }

        nav ul li a {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        nav ul li a:hover {
            color: #c084fc;
        }


        .contact-section {
            padding: 60px 80px;
            text-align: center;
        }

        .contact-section h2 {
            color: #c084fc;
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .contact-section p {
            color: #b3b3b3;
            font-size: 1rem;
            margin-bottom: 40px;
        }

        .contact-form {
            max-width: 500px;
            margin: 0 auto;
            background-color: #141445;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(192, 132, 252, 0.3);
        }

        .contact-form input,
        .contact-form textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: none;
            border-radius: 6px;
            background-color: #1e1e4b;
            color: #fff;
            font-size: 1rem;
        }

        .contact-form input::placeholder,
        .contact-form textarea::placeholder {
            color: #b3b3b3;
        }

        .contact-form button {
            background-color: #c084fc;
            color: #fff;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .contact-form button:hover {
            background-color: #a855f7;
        }


        .back-home {
            color: #ff0000;
            text-decoration: none;
            font-weight: 500;
            display: block;
            text-align: center;
            margin: 40px auto;
            width: fit-content;
        }

        .back-home:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <nav>
        <h1>Mihir's Portfolio</h1>
        <ul>
            <li><a href="home.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="contact.html">Contact Me</a></li>
        </ul>
    </nav>

    <!-- Contact Section -->
    <section class="contact-section">
        <h2>Contact Me</h2>
        <p>Feel free to reach out for collaborations, project discussions, or any tech‑related queries!</p>

        <form class="contact-form">
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <textarea rows="5" placeholder="Your Message" required></textarea>
            <button type="submit">Send Message</button>
        </form>

        <footer>
            <a href="index.html" class="back-home">← Back to Home</a>
        </footer>
    </section>
</body>

</html>
